<!DOCTYPE html>
<!--
  ============================================================
  خلاصه فارسی:
  این فایل صفحه ورود (لاگین) کاربران ثبت‌نام‌شده است.
  مسیر قرارگیری در مخزن: internal/api/static/index.html
  (فایل فعلی static/index.html را با این فایل جایگزین کنید.
   مسیرهای /login و /app/login در middleware به همین فایل نگاشت می‌شوند.)
  - ارسال فرم با fetch به POST /api/v1/auth/login
  - ذخیره token و user_id در localStorage
  - ریدایرکت به /settings/id_verification پس از موفقیت
  - لینک ثبت‌نام به /register و چک‌باکس Remember Me
  ============================================================
-->
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | BRICS PAY Borderless Transactions</title>
<style>
  :root {
    --bg-body: #05070a;
    --bg-panel: #0b0f17;
    --bg-input: #121824;
    --border-input: #1e293b;
    --border-focus: #388bfd;
    --text-main: #ffffff;
    --text-muted: #8b949e;
    --btn-blue: #2f81f7;
    --btn-blue-hover: #1f6feb;
    --error: #f85149;
    --success: #3fb950;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
  body {
    background-color: var(--bg-body);
    color: var(--text-main);
    min-height: 100vh;
  }
  .auth-container {
    display: flex;
    width: 100%;
    min-height: 100vh;
    background-color: var(--bg-body);
  }
  /* ستون برندینگ (سمت چپ در دسکتاپ) */
  .brand-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    background:
      radial-gradient(600px 400px at 20% 20%, rgba(47,129,247,.18), transparent 60%),
      radial-gradient(500px 400px at 80% 80%, rgba(245,197,24,.08), transparent 60%),
      var(--bg-panel);
    border-right: 1px solid var(--border-input);
    text-align: center;
  }
  .brand-side h1 { font-size: 34px; font-weight: 800; letter-spacing: 2px; margin: 24px 0 12px; }
  .brand-side p { color: var(--text-muted); font-size: 15px; max-width: 420px; line-height: 1.7; }
  .logo-nodes { display: flex; gap: 10px; }
  .logo-nodes span { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
  .node-red { background: #e23b3b; }
  .node-blue { background: #2f81f7; }
  .node-green { background: #21a35a; }
  .node-gold { background: #f5c518; }
  /* ستون فرم */
  .form-side {
    flex: 1;
    padding: 40px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }
  .auth-title { font-size: 30px; font-weight: 700; margin-bottom: 6px; }
  .auth-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 500; color: #c9d1d9; margin-bottom: 8px;
  }
  .form-control {
    width: 100%;
    background-color: var(--bg-input);
    border: 1px solid var(--border-input);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 14px;
    color: #ffffff;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .form-control:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(56,139,253,.15); }
  .form-control::placeholder { color: #484f58; }
  .form-options {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--text-muted); margin-bottom: 20px;
  }
  .remember { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .remember input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--btn-blue); cursor: pointer;
  }
  .btn-primary {
    width: 100%;
    background-color: var(--btn-blue);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .2s, opacity .2s;
  }
  .btn-primary:hover { background-color: var(--btn-blue-hover); }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  .signup-link { text-align: center; margin-top: 22px; font-size: 14px; color: var(--text-muted); }
  .signup-link a { color: var(--btn-blue); text-decoration: none; font-weight: 600; }
  .signup-link a:hover { text-decoration: underline; }
  /* توست وضعیت */
  #toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    display: none;
    z-index: 999;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  #toast.error { background: #2d1214; color: var(--error); border: 1px solid var(--error); }
  #toast.success { background: #0f2417; color: var(--success); border: 1px solid var(--success); }
  #toast.info { background: #0d1a2d; color: var(--btn-blue); border: 1px solid var(--btn-blue); }
  @media (max-width: 860px) {
    .brand-side { display: none; }
    .form-side { padding: 40px 24px; max-width: 100%; }
  }
</style>
</head>
<body>
<div id="toast"></div>

<div class="auth-container">
  <aside class="brand-side">
    <div class="logo-nodes">
      <span class="node-red"></span><span class="node-blue"></span>
      <span class="node-green"></span><span class="node-gold"></span>
    </div>
    <h1>BRICS PAY</h1>
    <p>Borderless transactions for the BRICS nations. Sign in to access your account and complete identity verification.</p>
  </aside>

  <main class="form-side">
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-subtitle">Sign in to your BRICS PAY account</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email"
               placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" id="rememberMe" name="remember_me">
          <span>Remember Me</span>
        </label>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
    </form>

    <p class="signup-link">
      Don't have an account? <a href="/register">Sign Up</a>
    </p>
  </main>
</div>

<script>
(function () {
  "use strict";

  var form = document.getElementById("loginForm");
  var btn = document.getElementById("loginBtn");
  var toast = document.getElementById("toast");
  var remember = document.getElementById("rememberMe");
  var emailInput = document.getElementById("email");
  var passwordInput = document.getElementById("password");

  function showToast(message, type) {
    toast.textContent = message;
    toast.className = type || "info";
    toast.style.display = "block";
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.style.display = "none"; }, 4000);
  }

  // بازیابی ایمیل ذخیره‌شده (Remember Me)
  try {
    var savedEmail = localStorage.getItem("bricspay_remembered_email");
    if (savedEmail) {
      emailInput.value = savedEmail;
      remember.checked = true;
    }
  } catch (e) { /* localStorage unavailable */ }

  form.addEventListener("submit", function (e) {
    e.preventDefault(); // جلوگیری از رفرش صفحه

    var email = (emailInput.value || "").trim().toLowerCase();
    var password = passwordInput.value || "";

    if (!email || email.indexOf("@") === -1) {
      showToast("Please enter a valid email address.", "error");
      return;
    }
    if (!password) {
      showToast("Please enter your password.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Signing in...";
    showToast("Signing in...", "info");

    fetch("/api/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ email: email, password: password })
    })
      .then(function (res) {
        return res.json().then(function (data) {
          return { ok: res.ok, status: res.status, data: data };
        });
      })
      .then(function (result) {
        if (result.ok && result.status === 200 && result.data && result.data.token) {
          // ذخیره توکن و شناسه کاربر
          try {
            localStorage.setItem("bricspay_token", result.data.token);
            if (result.data.user_id) {
              localStorage.setItem("bricspay_user_id", result.data.user_id);
            }
            if (remember.checked) {
              localStorage.setItem("bricspay_remembered_email", email);
            } else {
              localStorage.removeItem("bricspay_remembered_email");
            }
          } catch (err) { /* ignore storage errors */ }

          showToast(result.data.message || "Login successful", "success");
          setTimeout(function () {
            window.location.href = "/settings/id_verification";
          }, 800);
        } else if (result.status === 401) {
          showToast("Invalid email or password.", "error");
          btn.disabled = false;
          btn.textContent = "Sign In";
        } else {
          showToast((result.data && result.data.message) ||
            (result.data && result.data.error) || "Login failed.", "error");
          btn.disabled = false;
          btn.textContent = "Sign In";
        }
      })
      .catch(function () {
        showToast("Network error. Please try again.", "error");
        btn.disabled = false;
        btn.textContent = "Sign In";
      });
  });
})();
</script>
</body>
</html>
