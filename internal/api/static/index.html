<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRICS Pay | Core Ledger Dashboard</title>
    <style>
        :root {
            --bg-color: #06090e;
            --card-bg: #0d131d;
            --border-color: #1a2332;
            --primary: #00d2ff;
            --primary-hover: #00b4db;
            --success: #00e676;
            --danger: #ff5252;
            --text-main: #f0f4f8;
            --text-muted: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", "IRANSans", sans-serif;
            line-height: 1.6;
            padding: 1.5rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Top Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        select.lang-select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.45rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 0.4rem 0.8rem;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 6px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
        }

        /* Grid Cards */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
        }

        .card-header {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: #090e15;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button.btn {
            display: inline-block;
            width: 100%;
            padding: 0.65rem 1rem;
            background: var(--primary);
            color: #04080e;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn:hover {
            background: var(--primary-hover);
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: inherit;
        }

        th, td {
            padding: 0.75rem 0.9rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Alerts & Response */
        .alert {
            padding: 0.6rem 0.9rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            display: none;
        }

        .alert-success {
            background: rgba(0, 230, 118, 0.1);
            color: var(--success);
            border: 1px solid rgba(0, 230, 118, 0.25);
        }

        .alert-error {
            background: rgba(255, 82, 82, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 82, 82, 0.25);
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <div class="brand-title">BRICS Pay Core Ledger</div>
                <div class="status-badge" style="margin-top: 0.4rem;">
                    <span class="status-dot"></span>
                    <span id="txt-sys-status">وضعیت سیستم: آنلاین (عملیاتی)</span>
                </div>
            </div>
            <div class="header-actions">
                <select id="languageSelect" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="fa">فارسی (FA)</option>
                    <option value="en">English (EN)</option>
                    <option value="ru">Русский (RU)</option>
                </select>
            </div>
        </header>

        <main>
            <div class="grid">
                <!-- Create Account -->
                <div class="card">
                    <h2 class="card-header" id="txt-hdr-create-acc">افتتاح حساب جدید</h2>
                    <form id="createAccountForm" onsubmit="handleCreateAccount(event)">
                        <div class="form-group">
                            <label for="accId" id="lbl-acc-id">شناسه حساب</label>
                            <input type="text" id="accId" placeholder="acc_ru_01" required>
                        </div>
                        <div class="form-group">
                            <label for="accCurrency" id="lbl-currency">ارز پایه</label>
                            <select id="accCurrency" required>
                                <option value="RUB">RUB (روبل روسیه)</option>
                                <option value="IRR">IRR (ریال ایران)</option>
                                <option value="CNY">CNY (یوآن چین)</option>
                                <option value="AED">AED (درهم امارات)</option>
                                <option value="USD">USD</option>
                            </select>
                        </div>
                        <button type="submit" class="btn" id="btn-submit-acc">ثبت حساب</button>
                    </form>
                    <div id="accAlert" class="alert"></div>
                </div>

                <!-- Post Transaction -->
                <div class="card">
                    <h2 class="card-header" id="txt-hdr-post-tx">ثبت تراکنش تسویه</h2>
                    <form id="txForm" onsubmit="handlePostTransaction(event)">
                        <div class="form-group">
                            <label for="txFrom" id="lbl-from-acc">حساب بدهکار (From)</label>
                            <input type="text" id="txFrom" placeholder="acc_ru_01" required>
                        </div>
                        <div class="form-group">
                            <label for="txTo" id="lbl-to-acc">حساب بستانکار (To)</label>
                            <input type="text" id="txTo" placeholder="acc_ir_01" required>
                        </div>
                        <div class="form-group">
                            <label for="txAmount" id="lbl-amount">مبلغ</label>
                            <input type="number" id="txAmount" step="0.01" min="0.01" placeholder="1000.00" required>
                        </div>
                        <button type="submit" class="btn" id="btn-submit-tx">انتقال وجه</button>
                    </form>
                    <div id="txAlert" class="alert"></div>
                </div>
            </div>

            <!-- Accounts Ledger Table -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2 class="card-header" style="border-bottom: none; margin: 0; padding: 0;" id="txt-hdr-accounts">حساب‌های فعال در لجر</h2>
                    <button onclick="fetchAccounts()" style="background: transparent; color: var(--primary); border: 1px solid var(--border-color); padding: 0.35rem 0.8rem; border-radius: 4px; cursor: pointer;" id="btn-refresh">به‌روزرسانی ⟳</button>
                </div>
                <div class="table-responsive">
                    <table id="accountsTable">
                        <thead>
                            <tr>
                                <th id="th-acc-id">شناسه حساب</th>
                                <th id="th-currency">ارز</th>
                                <th id="th-balance">موجودی دفترکل</th>
                                <th id="th-created">تاریخ ایجاد</th>
                            </tr>
                        </thead>
                        <tbody id="accountsTableBody">
                            <tr>
                                <td colspan="4" style="text-align: center; color: var(--text-muted);" id="txt-loading">در حال فراخوانی داده‌ها...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer>
            <span id="txt-footer">زیرساخت آزمایشی تسویه چندارزی فرامرزی BRICS Pay • اتصال به هسته Go</span>
        </footer>
    </div>

    <script>
        const translations = {
            fa: {
                dir: "rtl",
                title: "BRICS Pay | Core Ledger Dashboard",
                sysStatus: "وضعیت سیستم: آنلاین (عملیاتی)",
                hdrCreateAcc: "افتتاح حساب جدید",
                lblAccId: "شناسه حساب",
                lblCurrency: "ارز پایه",
                btnSubmitAcc: "ثبت حساب",
                hdrPostTx: "ثبت تراکنش تسویه",
                lblFromAcc: "حساب بدهکار (From)",
                lblToAcc: "حساب بستانکار (To)",
                lblAmount: "مبلغ",
                btnSubmitTx: "انتقال وجه",
                hdrAccounts: "حساب‌های فعال در لجر",
                btnRefresh: "به‌روزرسانی ⟳",
                thAccId: "شناسه حساب",
                thCurrency: "ارز",
                thBalance: "موجودی دفترکل",
                thCreated: "تاریخ ایجاد",
                txtLoading: "در حال فراخوانی داده‌ها...",
                emptyAccounts: "هیچ حسابی یافت نشد.",
                accSuccess: "حساب با موفقیت در لجر ثبت شد.",
                txSuccess: "تراکنش تسویه با موفقیت پردازش شد.",
                footer: "زیرساخت آزمایشی تسویه چندارزی فرامرزی BRICS Pay • اتصال به هسته Go"
            },
            en: {
                dir: "ltr",
                title: "BRICS Pay | Core Ledger Dashboard",
                sysStatus: "System Status: Operational",
                hdrCreateAcc: "Open New Account",
                lblAccId: "Account ID",
                lblCurrency: "Base Currency",
                btnSubmitAcc: "Register Account",
                hdrPostTx: "Submit Settlement Transaction",
                lblFromAcc: "Debit Account (From)",
                lblToAcc: "Credit Account (To)",
                lblAmount: "Amount",
                btnSubmitTx: "Transfer Funds",
                hdrAccounts: "Active Ledger Accounts",
                btnRefresh: "Refresh ⟳",
                thAccId: "Account ID",
                thCurrency: "Currency",
                thBalance: "Ledger Balance",
                thCreated: "Created At",
                txtLoading: "Loading accounts...",
                emptyAccounts: "No registered accounts found.",
                accSuccess: "Account registered successfully.",
                txSuccess: "Settlement transaction executed successfully.",
                footer: "BRICS Pay Cross-border Multi-currency Settlement Sandbox • Go Core API"
            },
            ru: {
                dir: "ltr",
                title: "BRICS Pay | Панель управления реестром",
                sysStatus: "Статус системы: Работает штатно",
                hdrCreateAcc: "Открыть новый счет",
                lblAccId: "Идентификатор счета",
                lblCurrency: "Базовая валюта",
                btnSubmitAcc: "Зарегистрировать счет",
                hdrPostTx: "Провести расчетную транзакцию",
                lblFromAcc: "Дебетовый счет (Отправитель)",
                lblToAcc: "Кредитовый счет (Получатель)",
                lblAmount: "Сумма",
                btnSubmitTx: "Перевести средства",
                hdrAccounts: "Активные счета в реестре",
                btnRefresh: "Обновить ⟳",
                thAccId: "ID счета",
                thCurrency: "Валюта",
                thBalance: "Баланс реестра",
                thCreated: "Дата создания",
                txtLoading: "Загрузка счетов...",
                emptyAccounts: "Счета не найдены.",
                accSuccess: "Счет успешно зарегистрирован в реестре.",
                txSuccess: "Расчетная транзакция успешно завершена.",
                footer: "BRICS Pay — Песочница трансграничных расчетов в нацвалютах • Go Core"
            }
        };

        let currentLang = localStorage.getItem("bricspay_lang") || "fa";

        function changeLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            localStorage.setItem("bricspay_lang", lang);

            const t = translations[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = t.dir;
            document.title = t.title;

            document.getElementById("languageSelect").value = lang;
            document.getElementById("txt-sys-status").innerText = t.sysStatus;
            document.getElementById("txt-hdr-create-acc").innerText = t.hdrCreateAcc;
            document.getElementById("lbl-acc-id").innerText = t.lblAccId;
            document.getElementById("lbl-currency").innerText = t.lblCurrency;
            document.getElementById("btn-submit-acc").innerText = t.btnSubmitAcc;
            document.getElementById("txt-hdr-post-tx").innerText = t.hdrPostTx;
            document.getElementById("lbl-from-acc").innerText = t.lblFromAcc;
            document.getElementById("lbl-to-acc").innerText = t.lblToAcc;
            document.getElementById("lbl-amount").innerText = t.lblAmount;
            document.getElementById("btn-submit-tx").innerText = t.btnSubmitTx;
            document.getElementById("txt-hdr-accounts").innerText = t.hdrAccounts;
            document.getElementById("btn-refresh").innerText = t.btnRefresh;
            document.getElementById("th-acc-id").innerText = t.thAccId;
            document.getElementById("th-currency").innerText = t.thCurrency;
            document.getElementById("th-balance").innerText = t.thBalance;
            document.getElementById("th-created").innerText = t.thCreated;
            document.getElementById("txt-footer").innerText = t.footer;

            fetchAccounts();
        }

        async function fetchAccounts() {
            const tbody = document.getElementById("accountsTableBody");
            const t = translations[currentLang];
            try {
                const res = await fetch("/api/v1/accounts");
                if (!res.ok) throw new Error("HTTP error " + res.status);
                const data = await res.json();
                
                tbody.innerHTML = "";
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">${t.emptyAccounts}</td></tr>`;
                    return;
                }

                data.forEach(acc => {
                    const row = document.createElement("tr");
                    const dateStr = acc.created_at ? new Date(acc.created_at).toLocaleString(currentLang === 'fa' ? 'fa-IR' : (currentLang === 'ru' ? 'ru-RU' : 'en-US')) : "-";
                    row.innerHTML = `
                        <td><strong>${acc.id || acc.account_id || "-"}</strong></td>
                        <td>${acc.currency || "-"}</td>
                        <td>${Number(acc.balance || 0).toLocaleString()}</td>
                        <td>${dateStr}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--danger);">API Error: ${err.message}</td></tr>`;
            }
        }

        async function handleCreateAccount(e) {
            e.preventDefault();
            const id = document.getElementById("accId").value.trim();
            const currency = document.getElementById("accCurrency").value;
            const alertBox = document.getElementById("accAlert");
            const t = translations[currentLang];

            try {
                const res = await fetch("/api/v1/accounts", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: id, currency: currency })
                });

                if (!res.ok) {
                    const errData = await res.text();
                    throw new Error(errData || "Failed to create account");
                }

                alertBox.className = "alert alert-success";
                alertBox.innerText = t.accSuccess;
                alertBox.style.display = "block";
                document.getElementById("createAccountForm").reset();
                fetchAccounts();
            } catch (err) {
                alertBox.className = "alert alert-error";
                alertBox.innerText = err.message;
                alertBox.style.display = "block";
            }
            setTimeout(() => { alertBox.style.display = "none"; }, 5000);
        }

        async function handlePostTransaction(e) {
            e.preventDefault();
            const from = document.getElementById("txFrom").value.trim();
            const to = document.getElementById("txTo").value.trim();
            const amount = parseFloat(document.getElementById("txAmount").value);
            const alertBox = document.getElementById("txAlert");
            const t = translations[currentLang];

            try {
                const res = await fetch("/api/v1/transactions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_account: from,
                        to_account: to,
                        amount: amount
                    })
                });

                if (!res.ok) {
                    const errData = await res.text();
                    throw new Error(errData || "Transaction failed");
                }

                alertBox.className = "alert alert-success";
                alertBox.innerText = t.txSuccess;
                alertBox.style.display = "block";
                document.getElementById("txForm").reset();
                fetchAccounts();
            } catch (err) {
                alertBox.className = "alert alert-error";
                alertBox.innerText = err.message;
                alertBox.style.display = "block";
            }
            setTimeout(() => { alertBox.style.display = "none"; }, 5000);
        }

        // Initialize on page load
        document.addEventListener("DOMContentLoaded", () => {
            changeLanguage(currentLang);
        });
    </script>
</body>
</html>
